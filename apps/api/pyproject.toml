[project]
name = "webforge-api"
version = "0.0.0"
description = "WEBFORGE AI API service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.3",
    "structlog==26.1.0",
    "psycopg[binary]==3.3.9",
    "redis==8.2.0",
    "sqlalchemy==2.1.9",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "pyotp==2.12.1",
    "cryptography==50.0.2",
    "segno==1.6.6",
    "pyjwt==2.15.1",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "idna==3.20",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webforge_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608", "PT012", "PT018", "E501", "S104", "SIM105"]
"src/webforge_api/migrations/versions/**" = ["E501"]
"src/webforge_api/api/v1/discovery.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["webforge_api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
