# Throwaway Postgres + Redis for integration tests (`make test-integration`).
# Bound to 127.0.0.1 only; data is not persisted.
name: webforge-test

services:
  postgres:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: webforge
      POSTGRES_PASSWORD: webforge-test-only
      POSTGRES_DB: webforge
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webforge"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.12.0-alpine3.23@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
