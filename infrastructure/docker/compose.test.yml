# Throwaway Postgres + Redis for integration tests (`make test-integration`).
# Bound to 127.0.0.1 only; data is not persisted.
name: webforge-test

services:
  postgres:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_USER: webforge
      POSTGRES_PASSWORD: webforge-test-only
      POSTGRES_DB: webforge
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webforge"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.12.0-alpine3.23
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
