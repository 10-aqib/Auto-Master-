# Small-VM override (2 GB RAM, e.g. Compute Engine e2-small) for an internal pilot. Apply AFTER the production file:
#   docker compose -f docker-compose.yml -f infrastructure/production/docker-compose.prod.yml \
#     -f infrastructure/production/docker-compose.small-vm.yml <command>
# Requires a 2 GB swap file (infrastructure/vps/02-harden.sh --swap 2G) and, in .env, every *_WORKER_CONCURRENCY=1.
# Measured peak for the whole stack at concurrency 1 was ~1.1 GB; these are ceilings, not reservations.
# Health checks and restart policies are unchanged (defined in the base and production files).
services:
  caddy:        { mem_limit: 128m }
  postgres:     { mem_limit: 384m, shm_size: 128m }
  redis:        { mem_limit: 128m }
  api:          { mem_limit: 384m }
  preview:      { mem_limit: 192m }
  worker:       { mem_limit: 384m }
  worker-audit: { mem_limit: 320m }
  browser:      { mem_limit: 1024m, cpus: 1.0 }
  egress-proxy: { mem_limit: 128m }
  dashboard:    { mem_limit: 320m }
  ops:          { mem_limit: 192m }
